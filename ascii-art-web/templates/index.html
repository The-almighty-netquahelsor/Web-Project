<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>ASCII Art Generator</h1>

        <form action="/ascii-art" method="POST">
            <input type="text" name="text" placeholder="Type something...">

            <div class="banner-options">
                <label>
                    <input type="radio" name="banner" value="standard" checked> Standard
                </label>
                <label>
                    <input type="radio" name="banner" value="shadow"> Shadow
                </label>
                <label>
                    <input type="radio" name="banner" value="thinkertoy"> Thinkertoy
                </label>
            </div>

            <button type="submit">Generate</button>
        </form>

        <pre id="result">{{ .Result }}</pre>
    </div>
</body>
</html>
